<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Plonk compacts scattered workspaces</title><desc id="desc">Occupied workspaces 3, 4, 5, 7, and 8 become the contiguous sequence 1 through 5.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset="1" stop-color="#120d21"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/><text x="54" y="62" fill="#8ca2b8" font-family="system-ui,sans-serif" font-size="22" font-weight="700">BEFORE</text><text x="720" y="62" fill="#8ca2b8" font-family="system-ui,sans-serif" font-size="22" font-weight="700">AFTER ONE PLONK</text>
  <g font-family="ui-monospace,monospace" font-size="42" text-anchor="middle" dominant-baseline="central">
    <g fill="#0d2335" stroke="#34d6ff" stroke-width="2"><rect x="52" y="96" width="90" height="104" rx="16"/><rect x="152" y="96" width="90" height="104" rx="16"/><rect x="252" y="96" width="90" height="104" rx="16"/><rect x="352" y="96" width="90" height="104" rx="16"/><rect x="452" y="96" width="90" height="104" rx="16"/><rect x="552" y="96" width="90" height="104" rx="16"/></g>
    <g fill="#d9f8ff"><text x="97" y="148">3</text><text x="197" y="148">4</text><text x="297" y="148">5</text><text x="397" y="148">·</text><text x="497" y="148">7</text><text x="597" y="148">8</text></g>
    <path d="M655 148h54" stroke="#b7ff4a" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="m694 132 17 16-17 16" fill="none" stroke="#b7ff4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#161a3a" stroke="#a879ff" stroke-width="2"><rect x="720" y="96" width="80" height="104" rx="16"/><rect x="810" y="96" width="80" height="104" rx="16"/><rect x="900" y="96" width="80" height="104" rx="16"/><rect x="990" y="96" width="80" height="104" rx="16"/><rect x="1080" y="96" width="80" height="104" rx="16"/></g>
    <g fill="#f3eaff"><text x="760" y="148">1</text><text x="850" y="148">2</text><text x="940" y="148">3</text><text x="1030" y="148">4</text><text x="1120" y="148">5</text></g>
  </g>
  <text x="54" y="270" fill="#d7e3ed" font-family="system-ui,sans-serif" font-size="24">Close windows. Leave holes. Keep working.</text><text x="720" y="270" fill="#d7e3ed" font-family="system-ui,sans-serif" font-size="24">Same workspaces. No gaps.</text><text x="54" y="312" fill="#6f879c" font-family="ui-monospace,monospace" font-size="18">3 · 4 · 5 · 7 · 8</text><text x="720" y="312" fill="#b7ff4a" font-family="ui-monospace,monospace" font-size="18">1 · 2 · 3 · 4 · 5</text>
</svg>
