<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">How Plonk works</title><desc id="desc">Plonk reads Hyprland state, filters numeric occupied workspaces, packs their IDs, then restores focus.</desc>
  <rect width="1200" height="420" rx="28" fill="#08111d"/><text x="56" y="66" fill="#f2f7fb" font-family="system-ui,sans-serif" font-size="30" font-weight="750">One small command. Four deliberate steps.</text>
  <g font-family="system-ui,sans-serif"><g fill="#0d2233" stroke="#2ecff3" stroke-width="2"><rect x="55" y="112" width="235" height="190" rx="22"/><rect x="340" y="112" width="235" height="190" rx="22"/><rect x="625" y="112" width="235" height="190" rx="22"/><rect x="910" y="112" width="235" height="190" rx="22"/></g>
  <g fill="#b7ff4a" font-family="ui-monospace,monospace" font-size="18" font-weight="700"><text x="82" y="150">01 / READ</text><text x="367" y="150">02 / FILTER</text><text x="652" y="150">03 / PACK</text><text x="937" y="150">04 / FOCUS</text></g>
  <g fill="#f2f7fb" font-size="25" font-weight="700"><text x="82" y="195">Ask Hyprland</text><text x="367" y="195">Keep occupied</text><text x="652" y="195">Renumber 1…N</text><text x="937" y="195">Follow the user</text></g>
  <g fill="#91a7b9" font-size="18"><text x="82" y="230">workspaces · clients</text><text x="367" y="230">positive numeric IDs</text><text x="652" y="230">prefer change_id</text><text x="937" y="230">active workspace gets</text><text x="82" y="257">active workspace</text><text x="367" y="257">with open windows</text><text x="652" y="257">fallback: move windows</text><text x="937" y="257">its new number</text></g></g>
  <g stroke="#a879ff" stroke-width="4" fill="none" stroke-linecap="round"><path d="M296 207h35"/><path d="m319 196 12 11-12 11"/><path d="M581 207h35"/><path d="m604 196 12 11-12 11"/><path d="M866 207h35"/><path d="m889 196 12 11-12 11"/></g>
  <rect x="55" y="336" width="1090" height="48" rx="14" fill="#111a29"/><text x="600" y="368" text-anchor="middle" fill="#cdd9e3" font-family="ui-monospace,monospace" font-size="18">deterministic · idempotent · inspectable with --dry-run</text>
</svg>
