<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Plonk safety boundary</title><desc id="desc">Numeric occupied workspaces are compacted, while named, scratchpad, and empty special workspaces remain untouched.</desc>
  <rect width="1200" height="400" rx="28" fill="#09111d"/><text x="56" y="64" fill="#f3f7fb" font-family="system-ui,sans-serif" font-size="30" font-weight="750">A narrow blast radius by design.</text>
  <g font-family="system-ui,sans-serif"><rect x="55" y="108" width="520" height="222" rx="22" fill="#0b2830" stroke="#42e6c4" stroke-width="2"/><rect x="625" y="108" width="520" height="222" rx="22" fill="#171522" stroke="#655c76" stroke-width="2"/><text x="86" y="152" fill="#42e6c4" font-size="18" font-weight="800">PLONK TOUCHES</text><text x="656" y="152" fill="#a99db8" font-size="18" font-weight="800">PLONK LEAVES ALONE</text>
  <g fill="#eef8f6" font-size="24" font-weight="650"><text x="86" y="205">✓ Positive numeric workspaces</text><text x="86" y="249">✓ Workspaces with windows</text><text x="86" y="293">✓ Their numeric IDs</text></g><g fill="#d7d0df" font-size="24" font-weight="650"><text x="656" y="205">— Named workspaces</text><text x="656" y="249">— Scratchpads / special IDs</text><text x="656" y="293">— Window layout and contents</text></g></g>
  <text x="600" y="370" text-anchor="middle" fill="#8da2b5" font-family="ui-monospace,monospace" font-size="18">Preview the exact plan first: plonk --dry-run</text>
</svg>
