<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Multi-monitor workspace compaction</title><desc id="desc">Workspace IDs compact globally while each workspace remains on its original monitor.</desc>
  <defs><linearGradient id="g" x2="1"><stop stop-color="#32d6ff"/><stop offset="1" stop-color="#a879ff"/></linearGradient></defs><rect width="1200" height="430" rx="28" fill="#080f1a"/><text x="56" y="62" fill="#f2f7fb" font-family="system-ui,sans-serif" font-size="30" font-weight="750">Global numbers. Local monitors.</text><text x="56" y="94" fill="#8ea4b7" font-family="system-ui,sans-serif" font-size="18">Plonk fills one global number line without throwing workspaces onto the other display.</text>
  <g fill="#0c1d2d" stroke="#273d51" stroke-width="3"><rect x="55" y="132" width="510" height="208" rx="18"/><rect x="635" y="132" width="510" height="208" rx="18"/></g><g stroke="url(#g)" stroke-width="8"><path d="M190 355h240"/><path d="M770 355h240"/></g>
  <g font-family="system-ui,sans-serif"><text x="82" y="171" fill="#8ea4b7" font-size="17" font-weight="700">eDP-1</text><text x="662" y="171" fill="#8ea4b7" font-size="17" font-weight="700">HDMI-A-1</text></g>
  <g font-family="ui-monospace,monospace" font-size="32" text-anchor="middle" dominant-baseline="central"><g fill="#12304a" stroke="#35d5ff" stroke-width="2"><rect x="92" y="201" width="112" height="92" rx="15"/><rect x="222" y="201" width="112" height="92" rx="15"/></g><g fill="#dffaff"><text x="148" y="247">3→1</text><text x="278" y="247">5→2</text></g><g fill="#251943" stroke="#aa7cff" stroke-width="2"><rect x="672" y="201" width="112" height="92" rx="15"/><rect x="802" y="201" width="112" height="92" rx="15"/></g><g fill="#f2eaff"><text x="728" y="247">7→3</text><text x="858" y="247">8→4</text></g></g>
  <g font-family="system-ui,sans-serif" font-size="19"><text x="380" y="237" fill="#b7ff4a">stays here</text><text x="960" y="237" fill="#b7ff4a">stays here</text></g><text x="600" y="402" text-anchor="middle" fill="#c9d5de" font-family="system-ui,sans-serif" font-size="20">The IDs move down. The workspace layouts do not move across monitors.</text>
</svg>
